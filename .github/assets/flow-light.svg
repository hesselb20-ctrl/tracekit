<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 464" width="800" height="464" role="img" aria-label="Data flow: a HAR file is parsed and only JSON and fetch calls are kept. Secrets are redacted first, then the busiest origin is chosen. In analysis, raw paths are clustered into templates, request and response samples are merged into JSON Schema, and auth plus call order are detected. The output is openapi.yaml with tracekit.json, a typed TypeScript SDK, and an MCP server with one tool per operation.">
<style>
.s{font-family:'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
.ink{fill:#111111}.mute{fill:#5F5F5F}.acc{fill:#000000}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes fade{0%,100%{opacity:0}35%,65%{opacity:1}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(var(--d))}}
.pulse{animation:pulse 4s ease-in-out infinite}
.flow{stroke-dasharray:3 9;animation:dash 6s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="800" height="464" rx="3" fill="#F5F5F5"/>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E8E8E8" stroke-width="1"/></pattern></defs>
<rect width="800" height="464" rx="3" fill="url(#g)"/>
<path d="M24 14H14V24" fill="none" stroke="#5F5F5F" stroke-width="1"/><path d="M776 14H786V24" fill="none" stroke="#5F5F5F" stroke-width="1"/><path d="M24 450H14V440" fill="none" stroke="#5F5F5F" stroke-width="1"/><path d="M776 450H786V440" fill="none" stroke="#5F5F5F" stroke-width="1"/>
<text x="36" y="54" class="m" font-size="10.5"><tspan class="acc">A</tspan><tspan class="mute" dx="10">Read the recording</tspan></text><line x1="213.6" y1="50" x2="764" y2="50" stroke="#E8E8E8"/><rect x="36" y="72" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:0.00s" cx="52" cy="93" r="3" fill="#000000"/>
<text x="64" y="97" class="m ink" font-size="11" font-weight="600">HAR file</text>
<text x="52" y="119" class="s mute" font-size="12">browser Network export</text>
<text x="52" y="135" class="s mute" font-size="12">fetch, XHR and JSON calls kept</text><path class="flow" d="M252 111H287" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M286 107l5 4l-5 4" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="292" y="72" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:0.45s" cx="308" cy="93" r="3" fill="#000000"/>
<text x="320" y="97" class="m ink" font-size="11" font-weight="600">Redact</text>
<text x="308" y="119" class="s mute" font-size="12">tokens, cookies, keys, emails</text>
<text x="308" y="135" class="s mute" font-size="12">stable placeholders, first</text><path class="flow" d="M508 111H543" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M542 107l5 4l-5 4" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="548" y="72" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:0.90s" cx="564" cy="93" r="3" fill="#000000"/>
<text x="576" y="97" class="m ink" font-size="11" font-weight="600">Pick origin</text>
<text x="564" y="119" class="s mute" font-size="12">busiest origin by default</text>
<text x="564" y="135" class="s mute" font-size="12">--origin to choose another</text><path class="flow" d="M656 150V172H226V207" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M222 206l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><text x="36" y="194" class="m" font-size="10.5"><tspan class="acc">B</tspan><tspan class="mute" dx="10">Analyse</tspan></text><line x1="123.39999999999999" y1="190" x2="764" y2="190" stroke="#E8E8E8"/><rect x="36" y="212" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:1.35s" cx="52" cy="233" r="3" fill="#000000"/>
<text x="64" y="237" class="m ink" font-size="11" font-weight="600">Cluster paths</text>
<text x="52" y="259" class="s mute" font-size="12">/todos/17 becomes /todos/{id}</text>
<text x="52" y="275" class="s mute" font-size="12">ids, uuids, dates, slugs</text><path class="flow" d="M252 251H287" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M286 247l5 4l-5 4" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="292" y="212" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:1.80s" cx="308" cy="233" r="3" fill="#000000"/>
<text x="320" y="237" class="m ink" font-size="11" font-weight="600">Infer schemas</text>
<text x="308" y="259" class="s mute" font-size="12">samples merged per endpoint</text>
<text x="308" y="275" class="s mute" font-size="12">into JSON Schema</text><path class="flow" d="M508 251H543" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M542 247l5 4l-5 4" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="548" y="212" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:2.25s" cx="564" cy="233" r="3" fill="#000000"/>
<text x="576" y="237" class="m ink" font-size="11" font-weight="600">Auth + order</text>
<text x="564" y="259" class="s mute" font-size="12">bearer, API key or cookie</text>
<text x="564" y="275" class="s mute" font-size="12">which call feeds which</text><path class="flow" d="M656 290V312H226V347" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M222 346l4 5l4 -5" fill="none" stroke="#000000" stroke-width="1.2"/><text x="36" y="334" class="m" font-size="10.5"><tspan class="acc">C</tspan><tspan class="mute" dx="10">Generate</tspan></text><line x1="131.6" y1="330" x2="764" y2="330" stroke="#E8E8E8"/><rect x="36" y="352" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:2.70s" cx="52" cy="373" r="3" fill="#000000"/>
<text x="64" y="377" class="m ink" font-size="11" font-weight="600">openapi.yaml</text>
<text x="52" y="399" class="s mute" font-size="12">OpenAPI 3.1 spec</text>
<text x="52" y="415" class="s mute" font-size="12">plus tracekit.json</text><path class="flow" d="M252 391H287" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M286 387l5 4l-5 4" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="292" y="352" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:3.15s" cx="308" cy="373" r="3" fill="#000000"/>
<text x="320" y="377" class="m ink" font-size="11" font-weight="600">sdk/</text>
<text x="308" y="399" class="s mute" font-size="12">typed TypeScript client</text>
<text x="308" y="415" class="s mute" font-size="12">keeps the issued token</text><path class="flow" d="M508 391H543" fill="none" stroke="#000000" stroke-width="1.5"/><path d="M542 387l5 4l-5 4" fill="none" stroke="#000000" stroke-width="1.2"/><rect x="548" y="352" width="216" height="78" rx="2" fill="#EBEBEB" stroke="#C8C8C8"/>
<circle class="pulse" style="animation-delay:3.60s" cx="564" cy="373" r="3" fill="#000000"/>
<text x="576" y="377" class="m ink" font-size="11" font-weight="600">mcp-server/</text>
<text x="564" y="399" class="s mute" font-size="12">one tool per operation</text>
<text x="564" y="415" class="s mute" font-size="12">stdio, token stays in process</text>
</svg>