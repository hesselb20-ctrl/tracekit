<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 982" width="420" height="982" role="img" aria-label="Data flow: a HAR file is parsed and only JSON and fetch calls are kept. Secrets are redacted first, then the busiest origin is chosen. In analysis, raw paths are clustered into templates, request and response samples are merged into JSON Schema, and auth plus call order are detected. The output is openapi.yaml with tracekit.json, a typed TypeScript SDK, and an MCP server with one tool per operation.">
<style>
.s{font-family:'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
.ink{fill:#EDEDED}.mute{fill:#8C8C8C}.acc{fill:#FFFFFF}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes fade{0%,100%{opacity:0}35%,65%{opacity:1}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(var(--d))}}
.pulse{animation:pulse 4s ease-in-out infinite}
.flow{stroke-dasharray:3 9;animation:dash 6s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="420" height="982" rx="3" fill="#0A0A0A"/>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#171717" stroke-width="1"/></pattern></defs>
<rect width="420" height="982" rx="3" fill="url(#g)"/>
<path d="M24 14H14V24" fill="none" stroke="#8C8C8C" stroke-width="1"/><path d="M396 14H406V24" fill="none" stroke="#8C8C8C" stroke-width="1"/><path d="M24 968H14V958" fill="none" stroke="#8C8C8C" stroke-width="1"/><path d="M396 968H406V958" fill="none" stroke="#8C8C8C" stroke-width="1"/>
<text x="30" y="56" class="m" font-size="11"><tspan class="acc">A</tspan><tspan class="mute" dx="10">Read the recording</tspan></text><rect x="30" y="72" width="360" height="72" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:0.00s" cx="48" cy="94" r="3.2" fill="#FFFFFF"/>
<text x="62" y="98" class="m ink" font-size="12" font-weight="600">HAR file</text>
<text x="48" y="118" class="s mute" font-size="13">browser Network export</text>
<text x="48" y="134" class="s mute" font-size="13">fetch, XHR and JSON calls kept</text><path class="flow" d="M350 144V163" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M346 162l4 5l4 -5" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><rect x="30" y="168" width="360" height="72" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:0.45s" cx="48" cy="190" r="3.2" fill="#FFFFFF"/>
<text x="62" y="194" class="m ink" font-size="12" font-weight="600">Redact</text>
<text x="48" y="214" class="s mute" font-size="13">tokens, cookies, keys, emails</text>
<text x="48" y="230" class="s mute" font-size="13">stable placeholders, first</text><path class="flow" d="M350 240V259" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M346 258l4 5l4 -5" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><rect x="30" y="264" width="360" height="72" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:0.90s" cx="48" cy="286" r="3.2" fill="#FFFFFF"/>
<text x="62" y="290" class="m ink" font-size="12" font-weight="600">Pick origin</text>
<text x="48" y="310" class="s mute" font-size="13">busiest origin by default</text>
<text x="48" y="326" class="s mute" font-size="13">--origin to choose another</text><path class="flow" d="M350 336V373" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M346 372l4 5l4 -5" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><text x="30" y="362" class="m" font-size="11"><tspan class="acc">B</tspan><tspan class="mute" dx="10">Analyse</tspan></text><rect x="30" y="378" width="360" height="72" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:1.35s" cx="48" cy="400" r="3.2" fill="#FFFFFF"/>
<text x="62" y="404" class="m ink" font-size="12" font-weight="600">Cluster paths</text>
<text x="48" y="424" class="s mute" font-size="13">/todos/17 becomes /todos/{id}</text>
<text x="48" y="440" class="s mute" font-size="13">ids, uuids, dates, slugs</text><path class="flow" d="M350 450V469" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M346 468l4 5l4 -5" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><rect x="30" y="474" width="360" height="72" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:1.80s" cx="48" cy="496" r="3.2" fill="#FFFFFF"/>
<text x="62" y="500" class="m ink" font-size="12" font-weight="600">Infer schemas</text>
<text x="48" y="520" class="s mute" font-size="13">samples merged per endpoint</text>
<text x="48" y="536" class="s mute" font-size="13">into JSON Schema</text><path class="flow" d="M350 546V565" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M346 564l4 5l4 -5" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><rect x="30" y="570" width="360" height="72" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:2.25s" cx="48" cy="592" r="3.2" fill="#FFFFFF"/>
<text x="62" y="596" class="m ink" font-size="12" font-weight="600">Auth + order</text>
<text x="48" y="616" class="s mute" font-size="13">bearer, API key or cookie</text>
<text x="48" y="632" class="s mute" font-size="13">which call feeds which</text><path class="flow" d="M350 642V679" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M346 678l4 5l4 -5" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><text x="30" y="668" class="m" font-size="11"><tspan class="acc">C</tspan><tspan class="mute" dx="10">Generate</tspan></text><rect x="30" y="684" width="360" height="72" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:2.70s" cx="48" cy="706" r="3.2" fill="#FFFFFF"/>
<text x="62" y="710" class="m ink" font-size="12" font-weight="600">openapi.yaml</text>
<text x="48" y="730" class="s mute" font-size="13">OpenAPI 3.1 spec</text>
<text x="48" y="746" class="s mute" font-size="13">plus tracekit.json</text><path class="flow" d="M350 756V775" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M346 774l4 5l4 -5" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><rect x="30" y="780" width="360" height="72" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:3.15s" cx="48" cy="802" r="3.2" fill="#FFFFFF"/>
<text x="62" y="806" class="m ink" font-size="12" font-weight="600">sdk/</text>
<text x="48" y="826" class="s mute" font-size="13">typed TypeScript client</text>
<text x="48" y="842" class="s mute" font-size="13">keeps the issued token</text><path class="flow" d="M350 852V871" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M346 870l4 5l4 -5" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><rect x="30" y="876" width="360" height="72" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:3.60s" cx="48" cy="898" r="3.2" fill="#FFFFFF"/>
<text x="62" y="902" class="m ink" font-size="12" font-weight="600">mcp-server/</text>
<text x="48" y="922" class="s mute" font-size="13">one tool per operation</text>
<text x="48" y="938" class="s mute" font-size="13">stdio, token stays in process</text>
</svg>