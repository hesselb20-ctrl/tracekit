<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
<title id="t">How tracekit works</title>
<desc id="d">Pipeline: a HAR file is redacted, requests are clustered into templated endpoints, schemas, auth and call order are inferred, and an OpenAPI spec, a TypeScript SDK and an MCP server are generated.</desc>
<rect width="1200" height="520" rx="24" fill="#0B0F14"/>
<text x="48" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#E6EDF3" text-anchor="start">How it works</text>
<text x="48" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8B9BB0" text-anchor="start">One recorded session in, three artifacts out. Secrets are removed before anything is written.</text>
<rect x="48" y="243" width="176" height="150" rx="14" fill="#121923" stroke="#243345" stroke-width="2"/>
<rect x="68" y="267" width="34" height="6" rx="3" fill="#5AA9FF"/>
