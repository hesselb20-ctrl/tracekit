<text x="276" y="373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8B9BB0" text-anchor="start">cookies, email</text>
