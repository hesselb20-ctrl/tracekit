<rect x="256" y="243" width="176" height="150" rx="14" fill="#121923" stroke="#243345" stroke-width="2"/>
<rect x="276" y="267" width="34" height="6" rx="3" fill="#FF6B6B"/>
<text x="276" y="313" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#E6EDF3" text-anchor="start">Redact</text>
